name: Validate agentic configuration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate configuration and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Validate agentic configuration
        run: python scripts/validate_agentic_config.py
      - name: Run validator tests
        run: python -m unittest discover -s tests -p test_validate_agentic_config.py
